<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Attendance Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">✓</div>
      <h1>Attendance Tracker</h1>
      <p class="sub">Sign in to your account</p>

      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="form-row">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" id="pw-toggle" title="Show password">
              <svg class="pw-eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" style="width:100%; justify-content:center; margin-top:6px;">Sign in</button>
      </form>



    </div>
  </div>

  <script>
    // If already signed in, go straight to the dashboard
    if (localStorage.getItem("token")) window.location.href = "/";

    // Password toggle
    const pwToggle = document.getElementById("pw-toggle");
    const pwInput = document.getElementById("password");
    if (pwToggle && pwInput) {
      pwToggle.addEventListener("click", () => {
        const isPassword = pwInput.type === "password";
        pwInput.type = isPassword ? "text" : "password";
        pwToggle.classList.toggle("active", isPassword);
      });
    }

    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const errBox = document.getElementById("login-error");
      errBox.classList.remove("show");
      const body = new URLSearchParams({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      });
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Login failed");
        }
        const data = await res.json();
        localStorage.setItem("token", data.access_token);
        window.location.href = "/";
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.add("show");
      }
    });
  </script>
</body>
</html>
